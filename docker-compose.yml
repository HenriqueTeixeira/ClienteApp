services:
  clienteapp:
    build: .
    container_name: ClienteApp
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - notification_network

networks:
  notification_network:
    external: true